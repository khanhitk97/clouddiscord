name: Build CloudDiscord IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Setup App Entry Point
        run: |
          # Tự động tạo AppEntry.swift nếu trong repo chưa có file chứa @main
          if ! grep -rq "@main" *.swift 2>/dev/null; then
            echo "Creating AppEntry.swift..."
            cat << 'EOF' > AppEntry.swift
          import SwiftUI

          @main
          struct CloudDiscordApp: App {
              var body: some Scene {
                  WindowGroup {
                      GalleryView()
                  }
              }
          }
          EOF
          fi

      - name: Generate Xcode Project with XcodeGen
        run: |
          brew install xcodegen

          cat << 'EOF' > project.yml
          name: CloudDiscord
          options:
            bundleIdPrefix: com.clouddiscord
            deploymentTarget:
              iOS: "17.0"
          targets:
            CloudDiscord:
              type: application
              platform: iOS
              sources:
                - path: .
                  includes:
                    - "*.swift"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.clouddiscord.app
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  OTHER_LDFLAGS: ["-framework", "SwiftUI", "-framework", "UIKit", "-framework", "PhotosUI"]
          EOF

          xcodegen generate

      - name: Build .app with xcodebuild
        run: |
          xcodebuild clean build \
            -project CloudDiscord.xcodeproj \
            -scheme CloudDiscord \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ runner.temp }}/build"

      - name: Package .app into .ipa
        run: |
          cd ${{ runner.temp }}/build/Release-iphoneos
          mkdir -p Payload
          cp -r CloudDiscord.app Payload/ 2>/dev/null || cp -r *.app Payload/
          zip -r "CloudDiscord.ipa" Payload
          mkdir -p ${{ github.workspace }}/output
          mv CloudDiscord.ipa ${{ github.workspace }}/output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudDiscord-IPA
          path: output/CloudDiscord.ipa
          retention-days: 14
