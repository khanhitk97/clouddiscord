name: Build CloudDiscord IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Find & Build Xcode Project
        run: |
          # Tự động tìm file .xcodeproj trong toàn bộ thư mục repo
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ Không tìm thấy file .xcodeproj nào trong repository!"
            echo "Danh sách các file hiện có:"
            ls -la
            exit 1
          fi

          echo "🔍 Đã tìm thấy dự án tại: $PROJECT_PATH"

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "CloudDiscord" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ runner.temp }}/build"

      - name: Package .app into .ipa
        run: |
          cd ${{ runner.temp }}/build/Release-iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r "CloudDiscord.ipa" Payload
          mkdir -p ${{ github.workspace }}/output
          mv CloudDiscord.ipa ${{ github.workspace }}/output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudDiscord-IPA
          path: output/CloudDiscord.ipa
          retention-days: 14
